name: CI and release

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
          skipPush: true
      - name: Install pinned standalone devenv CLI
        run: nix profile install github:cachix/devenv/2418e1b43797c44de5166176622c8d8fa0149871
      - name: Validate release tag and derive prerelease flag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: tag
        shell: devenv shell -- bash -e {0}
        run: |
          set -uo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "feishufs") | .version')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag must equal Cargo.toml version: v$version" >&2
            exit 1
          fi
          prerelease=false
          if [[ "${version%%+*}" == *-* ]]; then prerelease=true; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Install fuse3 for the FUSE smoke test
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: Run devenv hooks and the FUSE smoke test
        run: devenv test
      - name: Build, validate and package the Linux binary
        shell: devenv shell -- bash -e {0}
        run: |
          set -uo pipefail
          export LC_ALL=C
          outputs=$(devenv build outputs.feishufsLinux)
          linux=$(jq -er '."outputs.feishufsLinux"' <<< "$outputs")
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "feishufs") | .version')
          test "$("$linux/bin/feishufs" --version)" = "feishufs $version"
          "$linux/bin/feishufs" --help
          "$linux/bin/feishufs" inspect --help
          "$linux/bin/feishufs" mount --help
          # Package only the binary, public templates and license notices.
          assets="$PWD/.cache/release"
          linux_bundle=$(mktemp -d "$RUNNER_TEMP/feishufs-linux.XXXXXX")
          linux_archive="feishufs-v$version-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$assets"
          install -m755 "$linux/bin/feishufs" "$linux_bundle/feishufs"
          install -m644 .env.example "$linux_bundle/"
          install -m644 "$linux/share/licenses/feishufs/"* "$linux_bundle/"
          tar -C "$linux_bundle" --sort=name --mtime=@1 --owner=0 --group=0 --numeric-owner \
            -cf - feishufs LICENSE .env.example THIRD_PARTY_LICENSES.html RUST-STDLIB.html MUSL-COPYRIGHT.txt \
            | gzip -n > "$assets/$linux_archive"
          diff -u <(printf '%s\n' .env.example LICENSE MUSL-COPYRIGHT.txt RUST-STDLIB.html THIRD_PARTY_LICENSES.html feishufs) \
            <(tar -tzf "$assets/$linux_archive" | sort)
          (
            cd "$assets"
            sha256sum "$linux_archive" > "$linux_archive.sha256"
            sha256sum --check "$linux_archive.sha256"
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: release
          path: |
            .cache/release/feishufs-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-musl.tar.gz
            .cache/release/feishufs-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-musl.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The write token is never available to checkout, Nix, Cargo or repository code.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: .cache/release
          digest-mismatch: error
      - name: Require unchanged remote tag and no existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          tag=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")
          while [ "$(jq -r '.object.type' <<< "$tag")" = tag ]; do
            sha=$(jq -r '.object.sha' <<< "$tag")
            tag=$(gh api "repos/$GH_REPO/git/tags/$sha")
          done
          test "$(jq -r '.object.type' <<< "$tag")" = commit
          test "$(jq -r '.object.sha' <<< "$tag")" = "$RELEASE_COMMIT"
          encoded_tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/release.json" \
            --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GH_REPO/releases/tags/$encoded_tag")
          case "$status" in
            404) ;;
            200) echo "Release already exists; refusing to replace it" >&2; exit 1 ;;
            *) echo "Cannot check release existence (HTTP $status)" >&2; exit 1 ;;
          esac
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            .cache/release/feishufs-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-musl.tar.gz
            .cache/release/feishufs-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-musl.tar.gz.sha256
