[project]
name = "feishufs"
revision = "1.0"

[profiles.default]
FEISHU_APP_ID = { description = "Feishu/Lark application ID", required = true, providers = ["dotenv"] }
FEISHU_APP_SECRET = { description = "Feishu/Lark application secret", required = true, providers = ["dotenv"] }
FEISHU_USER_ACCESS_TOKEN = { description = "Optional user access token", required = false, providers = ["dotenv"] }
FEISHU_API_BASE_URL = { description = "Optional API base URL override; omit for automatic Feishu/Lark selection", required = false, providers = ["dotenv"] }
