[package]
name = "feishufs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Mount a Feishu/Lark knowledge base as a read-only filesystem"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
fsk = "0.0.9"
humantime = "2.4.0"
openlark-auth = "=0.20.0"
openlark-core = "=0.20.0"
openlark-docs = { version = "=0.20.0", features = ["ccm-wiki", "ccm-doc", "ccm-drive"] }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_ProjectedFileSystem"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
