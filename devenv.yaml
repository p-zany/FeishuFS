# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
# flake.nix / flake.lock 是 inputs 与版本的单源；devenv.lock 由 `devenv update`
# 从 flake.lock 派生，不在此重复声明 URL 或修订版本。
inputs:
  devenv:
    follows: self/devenv
  self:
    url: path:.
  nixpkgs:
    follows: self/nixpkgs
  git-hooks:
    follows: self/git-hooks
  rust-overlay:
    follows: self/rust-overlay
